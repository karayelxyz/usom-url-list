name: Full Sync (manual)

on:
  # Manual only. Use this to build the list from scratch (first run) or to repair
  # it when something looks wrong. Scheduled updates are handled by the
  # incremental workflow, which only adds newly published addresses.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and verify only, publish nothing'
        type: boolean
        default: false

permissions:
  contents: write

# Shared with the incremental sync: only one writer may touch main at a time.
concurrency:
  group: usom-sync
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash scripts/sync.sh full
