name: Incremental Sync (every 3 hours)

on:
  schedule:
    # Off the top of the hour: GitHub schedules are best effort and the start of
    # every hour is the busiest slot (see "Events that trigger workflows" docs).
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and verify only, publish nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # needed to request a full reconciliation

# Shared with the full sync: only one writer may touch main at a time.
concurrency:
  group: usom-sync
  cancel-in-progress: false

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash scripts/sync.sh incremental

      # Removals cannot be seen by a date window: the published list can only grow
      # between full syncs. When it drifts above the API size, ask for a rebuild.
      - name: Reconcile removals
        if: steps.sync.outputs.reconcile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-full-sync.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Requested a full sync to reconcile removed records."

      # Optional liveness signal: add a repository secret named HC_PING_URL
      # (for example a healthchecks.io ping URL) to be alerted when no sync
      # completes. A missing ping covers dropped schedules and stuck queues.
      # - name: Liveness ping
      #   if: success()
      #   run: curl -fsS -m 10 "${{ secrets.HC_PING_URL }}" || true
