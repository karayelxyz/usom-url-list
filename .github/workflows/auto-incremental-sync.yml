name: Incremental Sync (every 3 hours)

on:
  schedule:
    # Off the top of the hour: GitHub schedules are best effort and the start of
    # every hour is the busiest slot (see "Events that trigger workflows" docs).
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and verify only, publish nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # the Pages guard may re-run a failed Pages build

# Shared with the full sync: only one writer may touch main at a time.
concurrency:
  group: usom-sync
  cancel-in-progress: false

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash scripts/sync.sh incremental

      # GitHub's own Pages build can fail transiently (seen: a 403 while
      # finalizing the artifact), and GitHub does not retry it, which leaves the
      # published site stale. This waits for that run and re-runs it once.
      - name: Guard the Pages deployment
        if: steps.sync.outputs.pushed == 'true'
        continue-on-error: true   # never fail the data sync over a deploy issue
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sync.outputs.commit_sha }}
        run: bash scripts/pages-guard.sh

      # Removals cannot be seen by an id walk that stops at the last published
      # record, so this job only logs a notice when the published list outgrows
      # the API. Run the manual Full Sync workflow to reconcile removed or
      # corrected addresses.

      # Optional liveness signal: add a repository secret named HC_PING_URL
      # (for example a healthchecks.io ping URL) to be alerted when no sync
      # completes. A missing ping covers dropped schedules and stuck queues.
      # - name: Liveness ping
      #   if: success()
      #   run: curl -fsS -m 10 "${{ secrets.HC_PING_URL }}" || true
